version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: airtravelerr-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airtravelerr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - airtravelerr-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: airtravelerr-server
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: airtravelerr
      DB_USER: postgres
      DB_PASSWORD: postgres
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: your_jwt_secret_key_change_this
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - airtravelerr-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: airtravelerr-client
    ports:
      - "5173:5173"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - airtravelerr-network

volumes:
  postgres_data:

networks:
  airtravelerr-network:
    driver: bridge